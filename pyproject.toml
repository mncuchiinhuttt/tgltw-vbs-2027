[project]
name = "tgltw-vbs-2027"
version = "0.1.0"
description = "Multimedia retrieval system for Video Browser Showdown 2027"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "opencv-python-headless>=4.5.0",
    "pillow>=9.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
]

[dependency-groups]
# The default environment is enough to start the FastAPI + Vite dashboard.
inference = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.21.0",
    "qdrant-client>=1.10.0,<1.11.0",
    "openai>=1.20.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "timm",
    "einops",
    "nnaudio",
    "sentence-transformers",
    "torchvision",
    "ultralytics>=8.4.0",
    "dashscope>=1.26.0",
]

preprocessing = [
    { include-group = "inference" },
    "scenedetect>=0.6.0",
    "librosa>=0.10.0",
    # Older facexlib metadata otherwise resolves numba 0.53/llvmlite 0.36,
    # which only supports Python <3.10.
    "numba>=0.60.0",
    "soundfile>=0.12.0",
    # ASR (Whisper large-v3-turbo via CTranslate2) - CUDA-or-CPU only, no
    # Apple Silicon MPS backend.
    "faster-whisper>=1.1.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.0.0",
    "basicsr",
    "realesrgan",
    "ftfy",
    "regex",
    "clip @ git+https://github.com/openai/CLIP.git",
]

upload = [
    "python-dotenv>=1.0.0",
    "tqdm>=4.60.0",
    "huggingface-hub>=0.23.0",
]

evaluation = [
    "ragas>=0.2.0",
    "datasets>=2.19.0",
]

dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
# This repository is an application, not an installable Python package.
package = false
