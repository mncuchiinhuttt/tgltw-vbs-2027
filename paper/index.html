<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS LaTeX Studio - VBS 2027</title>
    
    <!-- Google Fonts: JetBrains Mono & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"],
                    },
                    colors: {
                        rmit: {
                            red: "#E60028",
                            redDark: "#B80020",
                            blue: "#000054",
                            yellow: "#FFC700",
                        },
                        cyber: {
                            cyan: "#00F0FF",
                            cyanDark: "#00B8C4",
                            emerald: "#10B981",
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Ace Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-latex.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-bibtex.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/theme-tomorrow_night_eighties.js"></script>
    
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    
    <style>
        body.is-resizing {
            cursor: col-resize !important;
            user-select: none;
        }

        body.is-resizing .pdf-scroll-view {
            pointer-events: none;
        }

        #aceEditor {
            font-family: "JetBrains Mono", monospace !important;
            font-size: 13px !important;
            line-height: 1.65 !important;
            letter-spacing: normal !important;
        }

        #aceEditor .ace_text-layer,
        #aceEditor .ace_line,
        #aceEditor .ace_cursor,
        #aceEditor .ace_gutter {
            font-family: "JetBrains Mono", monospace !important;
            letter-spacing: normal !important;
            font-variant-ligatures: none !important;
        }

        .resizer-x {
            width: 4px;
            cursor: col-resize;
            background: #1e293b;
            transition: background 0.15s ease, width 0.15s ease;
            position: relative;
            z-index: 30;
            flex-shrink: 0;
        }

        .resizer-x:hover, .resizer-x.active {
            background: #00F0FF;
            width: 6px;
        }

        .pdf-scroll-view {
            background: #0B0F19;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .pdf-page-container {
            position: relative;
            background: white;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pdf-page-container canvas {
            display: block;
            border-radius: 4px;
        }

        .textLayer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.25;
            line-height: 1.0;
        }

        .textLayer ::selection {
            background: rgba(0, 240, 255, 0.7);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #090D16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-red {
            box-shadow: 0 0 20px -5px rgba(230, 0, 40, 0.4);
        }

        .glow-cyan {
            box-shadow: 0 0 20px -5px rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body class="bg-[#070A11] text-slate-100 h-screen flex flex-col overflow-hidden font-sans select-none antialiased">

    <!-- Top Navigation Bar (RMIT Cyber Style) -->
    <header class="bg-[#090D16] border-b border-slate-800/80 px-3 h-12 flex items-center justify-between gap-3 z-30 shadow-lg flex-shrink-0">
        
        <!-- Left: Brand Logo & Title -->
        <div class="flex items-center gap-2.5 min-w-0">
            <!-- Sidebar Toggle -->
            <button onclick="toggleLeftSidebar()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition" title="Toggle File Tree (Ctrl+B)">
                <i data-lucide="panel-left" class="w-4 h-4"></i>
            </button>

            <!-- AEGIS Cyber Badge -->
            <div class="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-rmit-red/15 border border-rmit-red/40 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-rmit-red animate-pulse"></span>
                <span class="text-xs font-black tracking-wider text-white font-mono uppercase">AEGIS STUDIO</span>
            </div>

            <div class="h-4 w-px bg-slate-800"></div>

            <div class="flex items-center gap-1.5 text-xs text-slate-300 truncate font-mono">
                <span class="text-slate-500 font-semibold">VBS-2027</span>
                <span class="text-slate-600">/</span>
                <i data-lucide="file-code" class="w-3.5 h-3.5 text-cyber-cyan"></i>
                <span id="navCurrentFileName" class="text-slate-100 font-semibold truncate">main.tex</span>
            </div>

            <!-- Engine Selection -->
            <div class="relative hidden sm:block">
                <select id="engineSelect" class="bg-slate-900 text-slate-300 border border-slate-800 rounded-lg px-2 py-1 text-[11px] font-mono appearance-none pr-5 focus:outline-none focus:border-cyber-cyan cursor-pointer hover:border-slate-700">
                    <option value="latexmk" selected>latexmk (auto)</option>
                    <option value="pdflatex">pdflatex</option>
                    <option value="xelatex">xelatex</option>
                </select>
                <i data-lucide="chevron-down" class="w-3 h-3 text-slate-500 absolute right-1.5 top-2 pointer-events-none"></i>
            </div>
        </div>

        <!-- Center: Action Controls -->
        <div class="flex items-center gap-2">
            <!-- Save Button -->
            <button onclick="saveCurrentFile()" id="saveBtn" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs font-semibold rounded-lg px-3 py-1.5 flex items-center gap-1.5 border border-slate-700 transition" title="Save File (Ctrl+S)">
                <i data-lucide="save" class="w-3.5 h-3.5 text-slate-400"></i>
                <span id="saveIndicator">Save</span>
            </button>

            <!-- Recompile Button (RMIT Red Primary Action) -->
            <button onclick="triggerSaveAndCompile()" id="compileBtn" class="bg-rmit-red hover:bg-rmit-redDark active:scale-95 text-white text-xs font-bold rounded-lg px-4 py-1.5 flex items-center gap-1.5 shadow-md glow-red transition" title="Recompile PDF (Ctrl+Enter)">
                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                <span>Recompile</span>
            </button>

            <!-- Status Indicator -->
            <div id="statusBadge" class="bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg flex items-center gap-1.5 text-[11px] font-mono text-slate-300">
                <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span id="statusText" class="hidden md:inline">Ready</span>
            </div>
        </div>

        <!-- Right: Utility Controls -->
        <div class="flex items-center gap-1.5 flex-shrink-0">
            <!-- Review Comments Button -->
            <button onclick="toggleRightSidebar()" id="headerCommentsBtn" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 transition" title="Advisor Comments">
                <i data-lucide="message-square" class="w-3.5 h-3.5 text-cyber-cyan"></i>
                <span class="hidden sm:inline">Review</span>
                <span id="commentsCountBadge" class="bg-rmit-red text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
            </button>

            <!-- Toggle Logs -->
            <button onclick="toggleLogs()" id="logToggleBtn" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 p-1.5 rounded-lg transition" title="Compilation Logs (Ctrl+L)">
                <i data-lucide="terminal" class="w-4 h-4"></i>
            </button>

            <div class="h-4 w-px bg-slate-800 mx-0.5"></div>

            <!-- Open in New Tab -->
            <button onclick="openPdfNewTab()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 p-1.5 rounded-lg transition" title="Open PDF in new tab">
                <i data-lucide="external-link" class="w-4 h-4"></i>
            </button>

            <!-- Download PDF -->
            <button onclick="downloadPdf()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 p-1.5 rounded-lg transition" title="Download PDF document">
                <i data-lucide="download" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 flex relative overflow-hidden w-screen" id="workspaceContainer">

        <!-- 1. LEFT SIDEBAR: FILE EXPLORER & ASSET UPLOAD -->
        <div class="left-sidebar w-[230px] h-full bg-[#080C14] border-r border-slate-800/80 flex flex-col relative z-20 min-w-[160px] max-w-[400px] flex-shrink-0" id="leftSidebar">
            <!-- Sidebar Header -->
            <div class="px-3 py-2.5 bg-[#0A0F1A] border-b border-slate-800 flex items-center justify-between">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5 font-mono">
                    <i data-lucide="folder-tree" class="w-3.5 h-3.5 text-cyber-cyan"></i>
                    FILES & FIGURES
                </span>
                
                <div class="flex items-center gap-1">
                    <button onclick="createNewItem('file')" class="text-slate-400 hover:text-cyber-cyan p-1 rounded hover:bg-slate-800 transition" title="New TeX / Bib File">
                        <i data-lucide="file-plus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="createNewItem('folder')" class="text-slate-400 hover:text-cyber-cyan p-1 rounded hover:bg-slate-800 transition" title="New Folder">
                        <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="document.getElementById('fileUploadInput').click()" class="text-slate-400 hover:text-emerald-400 p-1 rounded hover:bg-slate-800 transition" title="Upload Files / Figures">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- Hidden File Input for Upload -->
            <input type="file" id="fileUploadInput" multiple class="hidden" onchange="handleDirectFileUpload(event)">

            <!-- File Tree View Container -->
            <div id="fileTreeContainer" class="flex-1 overflow-y-auto p-2 flex flex-col gap-0.5 text-xs select-none font-mono">
                <div class="text-slate-500 text-center py-6 text-xs">Loading tree...</div>
            </div>

            <!-- Upload Figures Drop Zone Footer -->
            <div class="p-2.5 bg-[#0A0F1A] border-t border-slate-800/80">
                <div onclick="document.getElementById('fileUploadInput').click()" class="border border-dashed border-slate-700/80 hover:border-cyber-cyan/60 hover:bg-cyber-cyan/5 rounded-lg p-2.5 text-center cursor-pointer transition flex flex-col items-center gap-1 group">
                    <i data-lucide="image-plus" class="w-4 h-4 text-slate-500 group-hover:text-cyber-cyan transition"></i>
                    <span class="text-[10px] text-slate-400 font-medium font-mono">Drop figures or click to upload</span>
                </div>
            </div>
        </div>

        <!-- Resizer 0: Between Left Sidebar and Editor -->
        <div class="resizer-x" id="resizerTreeEditor" title="Drag to resize File Tree"></div>

        <!-- 2. CENTER-LEFT: ACE LATEX CODE EDITOR -->
        <div class="editor-pane flex-1 h-full flex flex-col bg-[#0A0F1A] relative min-w-[250px]" id="editorPane">
            <!-- Editor Subheader -->
            <div class="px-3.5 py-2 bg-[#090D16] border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 flex-shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                    <i data-lucide="code-2" class="w-3.5 h-3.5 text-cyber-cyan"></i>
                    <span id="currentFileName" class="font-mono text-slate-200 font-semibold truncate">main.tex</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[10px] text-slate-500 font-mono" id="editorModeBadge">LaTeX Syntax</span>
                </div>
            </div>

            <!-- Ace Editor Target Container -->
            <div id="aceEditor" class="flex-1 w-full h-full"></div>
        </div>

        <!-- Resizer 1: Between Editor and PDF Preview -->
        <div class="resizer-x" id="resizerEditorPdf" title="Drag to resize Editor / Preview"></div>

        <!-- 3. CENTER-RIGHT: PDF.JS REALTIME PREVIEW PANE -->
        <div class="preview-pane flex-1 h-full flex flex-col bg-[#070A11] relative min-w-[250px]" id="previewPane">
            <!-- Preview Controls Toolbar -->
            <div class="px-3 py-2 bg-[#090D16] border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 z-10 flex-shrink-0">
                <div class="flex items-center gap-1.5 font-mono">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-rmit-red"></i>
                    <span class="font-semibold text-slate-300">PDF Output</span>
                    <span id="pdfPageInfo" class="text-[11px] text-slate-500 ml-1.5">Loading...</span>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="adjustZoom(-0.1)" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition" title="Zoom Out">
                        <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    <span id="zoomLevel" class="text-[11px] font-mono w-10 text-center font-medium text-slate-300">100%</span>
                    <button onclick="adjustZoom(0.1)" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition" title="Zoom In">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="resetZoom()" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition ml-1" title="Reset Zoom">
                        <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- PDF Scroll View -->
            <div class="pdf-scroll-view flex-1 overflow-y-auto p-6 flex flex-col items-center gap-6 relative select-text" id="pdfScrollView">
                <div id="pdfLoadingNotice" class="text-slate-400 mt-16 flex items-center gap-2 text-sm font-mono">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-cyber-cyan"></i>
                    <span>Rendering PDF document...</span>
                </div>
            </div>
        </div>

        <!-- Resizer 2: Between PDF and Sidebar -->
        <div class="resizer-x" id="resizerPdfComments" title="Drag to resize Right Panel"></div>

        <!-- 4. RIGHT SIDEBAR: REVIEW COMMENTS & ADVISOR FEEDBACK (UNIFIED PANEL) -->
        <div class="right-panel w-[380px] h-full bg-[#080C14] border-l border-slate-800/80 flex flex-col relative z-20 min-w-[280px] max-w-[650px] flex-shrink-0" id="rightSidebar">
            <!-- Sidebar Header -->
            <div class="px-3.5 py-2.5 bg-[#0A0F1A] border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-slate-100 font-mono">
                    <i data-lucide="message-square" class="w-4 h-4 text-cyber-cyan"></i>
                    <span>REVIEW COMMENTS (<span id="panelCommentsCount">0</span>)</span>
                </div>

                <button onclick="toggleRightSidebar()" class="text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition" title="Close Panel">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Filter Chips Bar -->
            <div class="px-3 py-2 bg-[#090D16] border-b border-slate-800/80 flex items-center gap-1.5 overflow-x-auto no-scrollbar font-mono">
                <button class="filter-chip px-2.5 py-1 rounded-lg text-xs bg-rmit-red text-white font-semibold transition shadow-sm" onclick="setCommentFilter('all', this)">
                    All (<span id="countAll">0</span>)
                </button>
                <button class="filter-chip px-2.5 py-1 rounded-lg text-xs bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800 transition" onclick="setCommentFilter('open', this)">
                    Open (<span id="countOpen">0</span>)
                </button>
                <button class="filter-chip px-2.5 py-1 rounded-lg text-xs bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800 transition" onclick="setCommentFilter('resolved', this)">
                    Resolved (<span id="countResolved">0</span>)
                </button>
            </div>

            <!-- Comments List -->
            <div class="comments-list flex-1 overflow-y-auto p-3 flex flex-col gap-2.5 select-text" id="commentsList">
                <!-- Rendered dynamically -->
            </div>

            <!-- Unified Add Feedback / Comment Form -->
            <div class="p-3 bg-[#0A0F1A] border-t border-slate-800 flex flex-col gap-2.5 select-auto">
                <div class="text-xs font-bold text-cyber-cyan flex items-center justify-between font-mono">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                        <span>ADD FEEDBACK / COMMENT</span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-normal">Select text in PDF to quote</span>
                </div>

                <!-- Active Quoted Text from PDF Selection -->
                <div class="active-quote-preview hidden bg-cyber-cyan/10 border-l-2 border-cyber-cyan p-2 rounded-lg text-xs text-cyan-200 items-center justify-between gap-2" id="activeQuotePreview">
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        <i data-lucide="quote" class="w-3 h-3 text-cyber-cyan flex-shrink-0 mt-0.5"></i>
                        <span class="active-quote-text truncate italic" id="activeQuoteText"></span>
                    </div>
                    <button onclick="clearActiveQuote()" class="text-slate-400 hover:text-white p-0.5 flex-shrink-0" title="Remove quote">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>
                
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="authorInput" placeholder="Your Name / Role (e.g. Advisor)" class="w-full bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-cyber-cyan font-mono" />
                    </div>
                    <div class="relative w-36">
                        <select id="typeSelect" class="w-full bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-2 py-1.5 text-xs pr-6 appearance-none focus:outline-none focus:border-cyber-cyan cursor-pointer font-medium font-mono">
                            <option value="suggestion">Suggestion</option>
                            <option value="issue">Question / Issue</option>
                            <option value="todo">Todo / Revision</option>
                            <option value="praise">Praise</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500 absolute right-2 top-2 pointer-events-none"></i>
                    </div>
                </div>

                <div class="flex gap-2 font-mono">
                    <input type="text" id="sectionInput" placeholder="Section (e.g. Sec 3, Method)" class="flex-1 bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-cyber-cyan" />
                    <input type="text" id="pageInput" placeholder="Page" class="w-16 bg-slate-900 text-slate-200 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-cyber-cyan text-center" />
                </div>

                <textarea id="commentTextInput" placeholder="Write feedback, revision requirements, or suggestions..." class="w-full bg-slate-900 text-slate-200 border border-slate-800 rounded-lg p-2.5 text-xs min-h-[50px] resize-y focus:outline-none focus:border-cyber-cyan leading-relaxed"></textarea>
                
                <button onclick="submitComment()" class="w-full bg-rmit-red hover:bg-rmit-redDark active:scale-[0.99] text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 shadow-md glow-red transition font-mono uppercase tracking-wider">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>Post Comment</span>
                </button>
            </div>
        </div>

        <!-- 5. COMPILATION LOGS OVERLAY DRAWER -->
        <div id="logsDrawer" class="absolute bottom-0 left-0 right-0 h-56 bg-[#060910]/95 backdrop-blur-xl border-t border-slate-800 z-40 flex flex-col transition-transform duration-200 translate-y-full shadow-2xl">
            <div class="px-3.5 py-2 bg-[#090D16] border-b border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-mono font-bold text-slate-300">
                    <i data-lucide="terminal" class="w-3.5 h-3.5 text-cyber-cyan"></i>
                    <span>COMPILATION LOGS & ERRORS</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="clearLogs()" class="text-slate-400 hover:text-slate-200 text-xs px-2 py-0.5 rounded hover:bg-slate-800 font-mono transition">Clear</button>
                    <button onclick="toggleLogs()" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800 transition">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <pre id="logContent" class="flex-1 overflow-y-auto p-3.5 text-xs font-mono text-slate-300 leading-relaxed select-text whitespace-pre-wrap"></pre>
        </div>

    </div>

    <!-- Image Preview Modal -->
    <div id="imagePreviewModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-[#0A0F1A] border border-slate-700 rounded-xl max-w-2xl w-full p-4 flex flex-col gap-3 shadow-2xl animate-in zoom-in-95">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                <div class="flex items-center gap-2 font-mono">
                    <i data-lucide="image" class="w-4 h-4 text-cyber-cyan"></i>
                    <span id="imageModalTitle" class="text-xs font-bold text-slate-200"></span>
                </div>
                <button onclick="closeImageModal()" class="text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="flex-1 flex items-center justify-center bg-[#060910] p-4 rounded-lg border border-slate-800 max-h-[60vh] overflow-hidden">
                <img id="imageModalImg" src="" alt="Preview" class="max-w-full max-h-[50vh] object-contain rounded">
            </div>

            <div class="flex items-center justify-between pt-1 font-mono">
                <span id="imageModalInfo" class="text-[11px] text-slate-500"></span>

                <div class="flex items-center gap-2">
                    <button onclick="insertImageToLatex()" class="bg-rmit-red hover:bg-rmit-redDark text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow transition">
                        <i data-lucide="file-input" class="w-3.5 h-3.5"></i>
                        <span>Insert into LaTeX</span>
                    </button>
                    <button onclick="copyImagePath()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span id="copyImgBtnText">Copy Path</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        let editor = null;
        let isCompiling = false;
        let isDirty = false;
        let currentFile = "main.tex";
        let allComments = [];
        let currentCommentFilter = "all";

        let pdfScale = 1.15;
        let currentPdfDoc = null;

        let isLogsOpen = false;
        let activeSelectedQuote = "";
        let activeSelectedPage = "1";
        let currentModalImagePath = "";

        function refreshIcons() {
            lucide.createIcons();
        }

        function initAceEditor() {
            editor = ace.edit("aceEditor");
            editor.setTheme("ace/theme/tomorrow_night_eighties");
            editor.session.setMode("ace/mode/latex");
            editor.setOptions({
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: "13px",
                wrap: true,
                showPrintMargin: false,
                highlightActiveLine: true,
                enableBasicAutocompletion: true,
                enableLiveAutocompletion: true,
                tabSize: 2,
                useSoftTabs: true
            });

            editor.session.on("change", () => {
                if (!isDirty) {
                    isDirty = true;
                    document.getElementById("saveIndicator").textContent = "Save *";
                }
            });
        }

        function setupResizers() {
            const workspace = document.getElementById("workspaceContainer");
            const leftSidebar = document.getElementById("leftSidebar");
            const editorPane = document.getElementById("editorPane");
            const previewPane = document.getElementById("previewPane");
            const rightSidebar = document.getElementById("rightSidebar");

            const resizer0 = document.getElementById("resizerTreeEditor");
            const resizer1 = document.getElementById("resizerEditorPdf");
            const resizer2 = document.getElementById("resizerPdfComments");

            let isDragging0 = false;
            let isDragging1 = false;
            let isDragging2 = false;

            resizer0.addEventListener("mousedown", (e) => {
                isDragging0 = true;
                document.body.classList.add("is-resizing");
                resizer0.classList.add("active");
            });

            resizer1.addEventListener("mousedown", (e) => {
                isDragging1 = true;
                document.body.classList.add("is-resizing");
                resizer1.classList.add("active");
            });

            resizer2.addEventListener("mousedown", (e) => {
                isDragging2 = true;
                document.body.classList.add("is-resizing");
                resizer2.classList.add("active");
            });

            document.addEventListener("mousemove", (e) => {
                const workspaceRect = workspace.getBoundingClientRect();

                if (isDragging0) {
                    const newTreeWidth = e.clientX - workspaceRect.left;
                    if (newTreeWidth >= 140 && newTreeWidth <= 450) {
                        leftSidebar.style.width = `${newTreeWidth}px`;
                    }
                }

                if (isDragging1) {
                    const leftOffset = leftSidebar.classList.contains("hidden") ? 0 : leftSidebar.offsetWidth;
                    const newEditorWidth = e.clientX - workspaceRect.left - leftOffset;
                    if (newEditorWidth >= 180 && newEditorWidth <= (workspaceRect.width - leftOffset - 220)) {
                        editorPane.style.flex = "none";
                        editorPane.style.width = `${newEditorWidth}px`;
                        if (editor) editor.resize();
                    }
                }

                if (isDragging2) {
                    const newRightWidth = workspaceRect.right - e.clientX;
                    if (newRightWidth >= 240 && newRightWidth <= 750) {
                        rightSidebar.style.width = `${newRightWidth}px`;
                    }
                }
            });

            document.addEventListener("mouseup", () => {
                if (isDragging0 || isDragging1 || isDragging2) {
                    isDragging0 = false;
                    isDragging1 = false;
                    isDragging2 = false;
                    document.body.classList.remove("is-resizing");
                    resizer0.classList.remove("active");
                    resizer1.classList.remove("active");
                    resizer2.classList.remove("active");
                    if (editor) editor.resize();
                }
            });
        }

        function toggleLeftSidebar() {
            const sidebar = document.getElementById("leftSidebar");
            const resizer0 = document.getElementById("resizerTreeEditor");
            sidebar.classList.toggle("hidden");
            resizer0.style.display = sidebar.classList.contains("hidden") ? "none" : "flex";
            if (editor) editor.resize();
            refreshIcons();
        }

        function toggleRightSidebar() {
            const sidebar = document.getElementById("rightSidebar");
            const resizer2 = document.getElementById("resizerPdfComments");
            sidebar.classList.toggle("hidden");
            resizer2.style.display = sidebar.classList.contains("hidden") ? "none" : "flex";
            if (editor) editor.resize();
            refreshIcons();
        }

        async function loadFileTree() {
            const container = document.getElementById("fileTreeContainer");
            try {
                const res = await fetch("/api/tree");
                const data = await res.json();
                renderFileTree(data.tree, container);
            } catch (err) {
                container.innerHTML = `<div class="text-red-400 p-2 text-xs">Error loading files: ${err.message}</div>`;
            }
        }

        function renderFileTree(items, container) {
            container.innerHTML = "";
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="text-slate-500 text-center py-4 text-xs">Folder is empty</div>`;
                return;
            }

            const ul = document.createElement("ul");
            ul.className = "flex flex-col gap-0.5";

            items.forEach((item) => {
                const li = document.createElement("li");
                li.className = "flex flex-col";

                if (item.type === "directory") {
                    const header = document.createElement("div");
                    header.className = "flex items-center justify-between px-2 py-1 rounded-md hover:bg-slate-800/80 cursor-pointer text-slate-300 group";
                    header.innerHTML = `
                        <div class="flex items-center gap-1.5 min-w-0">
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500 group-hover:text-slate-300 transition-transform folder-chevron"></i>
                            <i data-lucide="folder" class="w-3.5 h-3.5 text-sky-400 flex-shrink-0"></i>
                            <span class="truncate font-semibold text-slate-200">${escapeHtml(item.name)}</span>
                        </div>
                    `;

                    const childrenDiv = document.createElement("div");
                    childrenDiv.className = "ml-3.5 pl-2 border-l border-slate-800 hidden";
                    renderFileTree(item.children, childrenDiv);

                    header.onclick = () => {
                        const isHidden = childrenDiv.classList.contains("hidden");
                        const chevron = header.querySelector(".folder-chevron");
                        if (isHidden) {
                            childrenDiv.classList.remove("hidden");
                            chevron.style.transform = "rotate(90deg)";
                        } else {
                            childrenDiv.classList.add("hidden");
                            chevron.style.transform = "none";
                        }
                    };

                    li.appendChild(header);
                    li.appendChild(childrenDiv);
                } else {
                    const isCurrent = currentFile === item.path;
                    const fileRow = document.createElement("div");
                    fileRow.className = `flex items-center justify-between px-2 py-1 rounded-md cursor-pointer transition group ${
                        isCurrent ? "bg-rmit-red/15 text-white font-semibold border-l-2 border-rmit-red" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"
                    }`;

                    let iconName = "file";
                    let iconColor = "text-slate-500";
                    if (item.name.endsWith(".tex")) { iconName = "file-code"; iconColor = "text-cyber-cyan"; }
                    else if (item.name.endsWith(".bib")) { iconName = "book-open"; iconColor = "text-emerald-400"; }
                    else if (item.name.endsWith(".cls") || item.name.endsWith(".bst") || item.name.endsWith(".sty")) { iconName = "settings"; iconColor = "text-purple-400"; }
                    else if (item.name.endsWith(".pdf")) { iconName = "file-text"; iconColor = "text-rmit-red"; }
                    else if (/\.(png|jpg|jpeg|svg|webp)$/i.test(item.name)) { iconName = "image"; iconColor = "text-yellow-400"; }

                    fileRow.innerHTML = `
                        <div class="flex items-center gap-1.5 min-w-0" onclick="loadFile('${item.path}')">
                            <i data-lucide="${iconName}" class="w-3.5 h-3.5 ${iconColor} flex-shrink-0"></i>
                            <span class="truncate">${escapeHtml(item.name)}</span>
                        </div>
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition flex-shrink-0">
                            <button onclick="renameItem('${item.path}')" class="p-0.5 hover:text-cyber-cyan text-slate-500 rounded" title="Rename">
                                <i data-lucide="edit-2" class="w-3 h-3"></i>
                            </button>
                            ${item.path !== 'main.tex' ? `
                            <button onclick="deleteFileOrDir('${item.path}', false)" class="p-0.5 hover:text-red-400 text-slate-500 rounded" title="Delete">
                                <i data-lucide="trash" class="w-3 h-3"></i>
                            </button>` : ""}
                        </div>
                    `;

                    li.appendChild(fileRow);
                }

                ul.appendChild(li);
            });

            container.appendChild(ul);
            refreshIcons();
        }

        function createNewItem(type) {
            const promptMsg = type === "folder" ? "Enter new folder name (e.g. figures, sections):" : "Enter new file name (e.g. section1.tex, references.bib):";
            const input = prompt(promptMsg);
            if (!input || !input.trim()) return;

            fetch("/api/file/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: input.trim(), type: type })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadFileTree();
                    if (type === "file") loadFile(input.trim());
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(err => alert("Failed to create item: " + err.message));
        }

        function renameItem(oldPath) {
            const newName = prompt(`Rename "${oldPath}" to:`, oldPath);
            if (!newName || newName.trim() === oldPath) return;

            fetch("/api/file/rename", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ oldPath, newPath: newName.trim() })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadFileTree();
                    if (currentFile === oldPath) loadFile(newName.trim());
                } else {
                    alert("Rename failed: " + data.error);
                }
            })
            .catch(err => alert("Error: " + err.message));
        }

        function deleteFileOrDir(path, isDir) {
            const confirmMsg = isDir ? `Delete folder "${path}" and ALL its contents?` : `Delete file "${path}"?`;
            if (!confirm(confirmMsg)) return;

            fetch(`/api/file?path=${encodeURIComponent(path)}`, { method: "DELETE" })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadFileTree();
                    if (currentFile === path) loadFile("main.tex");
                } else {
                    alert("Delete failed: " + data.error);
                }
            })
            .catch(err => alert("Delete error: " + err.message));
        }

        async function handleDirectFileUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            const payloadFiles = [];
            for (const file of files) {
                const b64 = await readFileAsBase64(file);
                payloadFiles.push({ name: file.name, data: b64 });
            }

            try {
                const res = await fetch("/api/upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ folder: "figures", files: payloadFiles })
                });
                const data = await res.json();
                if (data.success) {
                    await loadFileTree();
                    alert(`Uploaded ${data.uploaded.length} file(s) into figures/ folder.`);
                } else {
                    alert("Upload failed: " + data.error);
                }
            } catch (err) {
                alert("Upload error: " + err.message);
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(",")[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function loadPdfDocument(targetPdfFile = "main.pdf") {
            const pdfName = targetPdfFile.endsWith(".pdf") ? targetPdfFile : targetPdfFile.replace(/\.[^.]+$/, ".pdf");
            const pdfUrl = `/pdf?file=${encodeURIComponent(pdfName)}&t=${Date.now()}`;
            const container = document.getElementById("pdfScrollView");
            document.getElementById("pdfPageInfo").textContent = "Loading...";

            try {
                const loadingTask = pdfjsLib.getDocument({ url: pdfUrl });
                currentPdfDoc = await loadingTask.promise;
                document.getElementById("pdfPageInfo").textContent = `${currentPdfDoc.numPages} Page${currentPdfDoc.numPages > 1 ? "s" : ""}`;
                await renderAllPdfPages();
            } catch (err) {
                container.innerHTML = `<div class="text-red-400 p-8 text-center text-sm font-mono">Failed to render PDF (${err.message}).<br>Click 'Recompile' to build.</div>`;
            }
        }

        async function renderAllPdfPages() {
            if (!currentPdfDoc) return;
            const container = document.getElementById("pdfScrollView");
            container.innerHTML = "";

            const scale = pdfScale * 1.5;

            for (let pageNum = 1; pageNum <= currentPdfDoc.numPages; pageNum++) {
                const page = await currentPdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: scale });

                const pageWrapper = document.createElement("div");
                pageWrapper.className = "pdf-page-container";
                pageWrapper.id = `pdf-page-${pageNum}`;
                pageWrapper.setAttribute("data-page", pageNum);
                pageWrapper.style.width = `${viewport.width}px`;
                pageWrapper.style.height = `${viewport.height}px`;

                const canvas = document.createElement("canvas");
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;
                const ctx = canvas.getContext("2d");

                const textLayerDiv = document.createElement("div");
                textLayerDiv.className = "textLayer";
                textLayerDiv.style.width = `${viewport.width}px`;
                textLayerDiv.style.height = `${viewport.height}px`;

                pageWrapper.appendChild(canvas);
                pageWrapper.appendChild(textLayerDiv);
                container.appendChild(pageWrapper);

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                await page.render(renderContext).promise;

                const textContent = await page.getTextContent();
                await pdfjsLib.renderTextLayer({
                    textContentSource: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                }).promise;
            }
        }

        function adjustZoom(delta) {
            pdfScale = Math.max(0.6, Math.min(2.5, pdfScale + delta));
            document.getElementById("zoomLevel").textContent = `${Math.round(pdfScale * 100)}%`;
            renderAllPdfPages();
        }

        function resetZoom() {
            pdfScale = 1.15;
            document.getElementById("zoomLevel").textContent = "115%";
            renderAllPdfPages();
        }

        function setupTextSelectionListener() {
            document.addEventListener("mouseup", () => {
                setTimeout(() => {
                    const selection = window.getSelection();
                    const text = selection ? selection.toString().trim() : "";
                    if (text && text.length > 3) {
                        activeSelectedQuote = text;
                        const pageContainer = selection.anchorNode ? (selection.anchorNode.nodeType === 3 ? selection.anchorNode.parentElement : selection.anchorNode).closest(".pdf-page-container") : null;
                        if (pageContainer) {
                            activeSelectedPage = pageContainer.getAttribute("data-page") || "1";
                            document.getElementById("activeQuoteText").textContent = activeSelectedQuote;
                            document.getElementById("activeQuotePreview").classList.remove("hidden");
                            document.getElementById("activeQuotePreview").classList.add("flex");
                            document.getElementById("pageInput").value = activeSelectedPage;
                        }
                    }
                }, 20);
            });
        }

        function clearActiveQuote() {
            activeSelectedQuote = "";
            document.getElementById("activeQuoteText").textContent = "";
            document.getElementById("activeQuotePreview").classList.remove("flex");
            document.getElementById("activeQuotePreview").classList.add("hidden");
        }

        async function loadFile(filename) {
            if (isDirty) {
                if (confirm(`Save unsaved changes in ${currentFile} before switching?`)) {
                    await saveCurrentFile();
                }
            }

            if (/\.(png|jpg|jpeg|svg|webp)$/i.test(filename)) {
                openImageModal(filename);
                return;
            }

            currentFile = filename;
            document.getElementById("currentFileName").textContent = filename.split("/").pop();
            document.getElementById("navCurrentFileName").textContent = filename.split("/").pop();

            if (filename.endsWith(".bib")) editor.session.setMode("ace/mode/bibtex");
            else editor.session.setMode("ace/mode/latex");

            try {
                const res = await fetch(`/api/file?name=${encodeURIComponent(filename)}`);
                const data = await res.json();
                editor.setValue(data.content, -1);
                isDirty = false;
                document.getElementById("saveIndicator").textContent = "Save";
                await loadFileTree();
            } catch (err) {
                alert("Failed to load file: " + err.message);
            }
        }

        async function saveCurrentFile() {
            const saveBtn = document.getElementById("saveBtn");
            saveBtn.textContent = "Saving...";
            const content = editor.getValue();

            try {
                const res = await fetch("/api/file", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: currentFile, content: content })
                });
                const data = await res.json();
                if (data.success) {
                    isDirty = false;
                    document.getElementById("saveIndicator").textContent = "Save";
                }
            } catch (err) {
                alert("Save failed: " + err.message);
            } finally {
                saveBtn.textContent = "Save";
            }
        }

        async function triggerSaveAndCompile() {
            if (isCompiling) return;
            await saveCurrentFile();

            isCompiling = true;
            const targetFile = currentFile.endsWith(".tex") ? currentFile : "main.tex";
            const engine = document.getElementById("engineSelect").value || "latexmk";
            const compileBtn = document.getElementById("compileBtn");
            const statusDot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");

            compileBtn.classList.add("opacity-70", "pointer-events-none");
            statusDot.className = "w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse";
            statusText.textContent = "Compiling...";

            const startTime = performance.now();

            try {
                const res = await fetch("/api/compile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file: targetFile, engine: engine })
                });

                const data = await res.json();
                const duration = ((performance.now() - startTime) / 1000).toFixed(2);

                renderLogs(data.stdout + "\n" + (data.stderr || ""));

                if (data.success) {
                    statusDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
                    statusText.textContent = `Success (${duration}s)`;
                    await loadPdfDocument();
                } else {
                    statusDot.className = "w-1.5 h-1.5 rounded-full bg-rmit-red";
                    statusText.textContent = `Failed (${duration}s)`;
                    openLogs();
                }
            } catch (err) {
                statusDot.className = "w-1.5 h-1.5 rounded-full bg-rmit-red";
                statusText.textContent = "Error";
                openLogs();
            } finally {
                isCompiling = false;
                compileBtn.classList.remove("opacity-70", "pointer-events-none");
                refreshIcons();
            }
        }

        function renderLogs(rawText) {
            const logContent = document.getElementById("logContent");
            logContent.textContent = rawText.trim() || "Compilation finished with no output.";
        }

        function toggleLogs() {
            const drawer = document.getElementById("logsDrawer");
            isLogsOpen = !isLogsOpen;
            drawer.style.transform = isLogsOpen ? "translateY(0)" : "translateY(100%)";
            refreshIcons();
        }

        function openLogs() {
            const drawer = document.getElementById("logsDrawer");
            isLogsOpen = true;
            drawer.style.transform = "translateY(0)";
            refreshIcons();
        }

        function clearLogs() {
            document.getElementById("logContent").textContent = "";
        }

        function openPdfNewTab() {
            const pdfName = (currentFile.endsWith(".tex") ? currentFile : "main.tex").replace(/\.tex$/, ".pdf");
            window.open(`/pdf?file=${encodeURIComponent(pdfName)}&t=${Date.now()}`, "_blank");
        }

        function downloadPdf() {
            const pdfName = (currentFile.endsWith(".tex") ? currentFile : "main.tex").replace(/\.tex$/, ".pdf");
            const a = document.createElement("a");
            a.href = `/pdf?file=${encodeURIComponent(pdfName)}&download=1`;
            a.download = pdfName;
            a.click();
        }

        async function fetchComments() {
            try {
                const res = await fetch("/api/comments");
                allComments = await res.json();
                renderComments();
            } catch (err) {
                console.error("Failed to load comments:", err);
            }
        }

        function renderComments() {
            const list = document.getElementById("commentsList");
            const countBadge = document.getElementById("commentsCountBadge");
            const panelBadge = document.getElementById("panelCommentsCount");

            const openCount = allComments.filter(c => !c.resolved).length;
            const resolvedCount = allComments.filter(c => c.resolved).length;

            document.getElementById("countAll").textContent = allComments.length;
            document.getElementById("countOpen").textContent = openCount;
            document.getElementById("countResolved").textContent = resolvedCount;
            countBadge.textContent = openCount;
            panelBadge.textContent = openCount;

            const filtered = allComments.filter(c => {
                if (currentCommentFilter === "open") return !c.resolved;
                if (currentCommentFilter === "resolved") return c.resolved;
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-slate-500 text-center py-10 text-xs font-mono">No comments found</div>`;
                return;
            }

            list.innerHTML = filtered.map(c => {
                const tag = getTagConfig(c.type);
                const timeAgo = formatTimeAgo(c.createdAt);
                
                const quoteHtml = c.quote ? `
                    <div class="bg-cyber-cyan/10 border-l-2 border-cyber-cyan px-2.5 py-1.5 rounded-r text-xs text-cyan-200 italic flex items-start gap-1.5">
                        <i data-lucide="quote" class="w-3 h-3 text-cyber-cyan flex-shrink-0 mt-0.5"></i>
                        <span>${escapeHtml(c.quote)}</span>
                    </div>
                ` : "";

                return `
                    <div class="bg-[#0A0F1A] border ${c.resolved ? "border-slate-800 opacity-60" : "border-slate-800 hover:border-slate-700"} rounded-xl p-3 flex flex-col gap-2 transition cursor-pointer shadow-sm" onclick="if('${c.page}') scrollToPdfPage('${c.page}')">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-1.5 text-xs font-bold text-cyber-cyan font-mono">
                                <i data-lucide="user" class="w-3.5 h-3.5"></i>
                                <span>${escapeHtml(c.author || "Advisor")}</span>
                            </div>
                            <span class="text-[9px] uppercase font-bold px-2 py-0.5 rounded border flex items-center gap-1 font-mono ${tag.class}">
                                <i data-lucide="${tag.icon}" class="w-3 h-3"></i>
                                <span>${tag.label}</span>
                            </span>
                        </div>

                        ${quoteHtml}

                        <p class="text-xs text-slate-200 leading-relaxed">${escapeHtml(c.text)}</p>

                        <div class="flex items-center justify-between pt-1 border-t border-slate-800/80 text-[10px] text-slate-500 font-mono">
                            <div class="flex items-center gap-2">
                                ${c.section ? `<span>§ ${escapeHtml(c.section)}</span>` : ""}
                                ${c.page ? `<span>Page ${c.page}</span>` : ""}
                                <span>${timeAgo}</span>
                            </div>

                            <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                                <button onclick="toggleCommentResolved('${c.id}', ${!c.resolved})" class="px-2 py-0.5 rounded ${c.resolved ? 'bg-slate-800 text-slate-400' : 'bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30'} transition">
                                    ${c.resolved ? 'Reopen' : 'Resolve'}
                                </button>
                                <button onclick="deleteComment('${c.id}')" class="p-1 text-slate-500 hover:text-rmit-red rounded transition" title="Delete">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");

            refreshIcons();
        }

        function getTagConfig(type) {
            switch (type) {
                case "issue": return { label: "Issue", icon: "alert-circle", class: "bg-rmit-red/15 text-rmit-red border-rmit-red/30" };
                case "todo": return { label: "Revision", icon: "check-square", class: "bg-purple-500/15 text-purple-400 border-purple-500/30" };
                case "praise": return { label: "Praise", icon: "thumbs-up", class: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30" };
                default: return { label: "Suggestion", icon: "lightbulb", class: "bg-yellow-500/15 text-yellow-400 border-yellow-500/30" };
            }
        }

        function setCommentFilter(filter, el) {
            currentCommentFilter = filter;
            document.querySelectorAll(".filter-chip").forEach(btn => {
                btn.className = "filter-chip px-2.5 py-1 rounded-lg text-xs bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800 transition font-mono";
            });
            el.className = "filter-chip px-2.5 py-1 rounded-lg text-xs bg-rmit-red text-white font-semibold transition shadow-sm font-mono";
            renderComments();
        }

        async function submitComment() {
            const author = document.getElementById("authorInput").value.trim() || "Advisor";
            const type = document.getElementById("typeSelect").value;
            const section = document.getElementById("sectionInput").value.trim();
            const page = document.getElementById("pageInput").value.trim();
            const text = document.getElementById("commentTextInput").value.trim();

            if (!text) {
                alert("Please write a comment text");
                return;
            }

            localStorage.setItem("latex_author_name", author);

            const payload = {
                id: "c-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4),
                author,
                type,
                section,
                page,
                quote: activeSelectedQuote,
                text,
                createdAt: new Date().toISOString(),
                resolved: false
            };

            try {
                const res = await fetch("/api/comments", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById("commentTextInput").value = "";
                    document.getElementById("sectionInput").value = "";
                    clearActiveQuote();
                    await fetchComments();
                } else {
                    alert("Failed to post comment");
                }
            } catch (err) {
                alert("Error posting comment: " + err.message);
            }
        }

        async function toggleCommentResolved(id, resolved) {
            try {
                await fetch("/api/comments", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, resolved })
                });
                await fetchComments();
            } catch (err) {
                console.error("Failed to update comment status", err);
            }
        }

        async function deleteComment(id) {
            try {
                await fetch(`/api/comments?id=${encodeURIComponent(id)}`, { method: "DELETE" });
                await fetchComments();
            } catch (err) {
                alert("Failed to delete comment");
            }
        }

        function scrollToPdfPage(pageNum) {
            const pageEl = document.getElementById(`pdf-page-${pageNum}`);
            if (pageEl) {
                pageEl.scrollIntoView({ behavior: "smooth", block: "start" });
                pageEl.classList.add("ring-2", "ring-cyber-cyan");
                setTimeout(() => pageEl.classList.remove("ring-2", "ring-cyber-cyan"), 2000);
            }
        }

        function openImageModal(imgPath) {
            currentModalImagePath = imgPath;
            const modal = document.getElementById("imagePreviewModal");
            const title = document.getElementById("imageModalTitle");
            const img = document.getElementById("imageModalImg");
            const info = document.getElementById("imageModalInfo");

            title.textContent = imgPath;
            img.src = `/raw?path=${encodeURIComponent(imgPath)}&t=${Date.now()}`;
            info.textContent = `Asset: ${imgPath}`;
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            refreshIcons();
        }

        function closeImageModal() {
            const modal = document.getElementById("imagePreviewModal");
            modal.classList.remove("flex");
            modal.classList.add("hidden");
        }

        function copyImagePath() {
            navigator.clipboard.writeText(currentModalImagePath);
            const btn = document.getElementById("copyImgBtnText");
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = "Copy Path"; }, 1500);
        }

        function insertImageToLatex() {
            const latexSnippet = `
\\begin{figure}[t]
\\centering
\\includegraphics[width=0.85\\textwidth]{${currentModalImagePath}}
\\caption{System architecture overview and feature map.}
\\label{fig:${currentModalImagePath.split("/").pop().replace(/\\.[^.]+$/, "")}}
\\end{figure}
`;
            editor.insert(latexSnippet);
            closeImageModal();
        }

        function formatTimeAgo(isoString) {
            if (!isoString) return "";
            const sec = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
            if (sec < 60) return "just now";
            if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
            return `${Math.floor(sec / 86400)}d ago`;
        }

        function escapeHtml(str) {
            return String(str || "").replace(/[&<>"']/g, m => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            }[m]));
        }

        // Global Keyboard Shortcuts
        document.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "s") {
                e.preventDefault();
                saveCurrentFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                triggerSaveAndCompile();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === "b" || e.key === "B")) {
                e.preventDefault();
                toggleLeftSidebar();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")) {
                e.preventDefault();
                toggleLogs();
            }
        });

        window.addEventListener("DOMContentLoaded", async () => {
            initAceEditor();
            setupResizers();
            setupTextSelectionListener();
            await loadFileTree();
            await loadFile("main.tex");

            const savedAuthor = localStorage.getItem("latex_author_name");
            if (savedAuthor) {
                document.getElementById("authorInput").value = savedAuthor;
            }

            fetchComments();
            loadPdfDocument("main.pdf");
            refreshIcons();
        });
    </script>
</body>
</html>
