<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS Paper Review Studio - VBS 2027</title>
    
    <!-- Google Fonts: JetBrains Mono & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"],
                    },
                    colors: {
                        rmit: {
                            red: "#E60028",
                            redDark: "#B80020",
                            blue: "#000054",
                            yellow: "#FFC700",
                        },
                        cyber: {
                            cyan: "#00F0FF",
                            cyanDark: "#00B8C4",
                            emerald: "#10B981",
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    
    <style>
        body.is-resizing {
            cursor: col-resize !important;
            user-select: none;
        }

        body.is-resizing .pdf-scroll-view {
            pointer-events: none;
        }

        .resizer-x {
            width: 4px;
            cursor: col-resize;
            background: rgba(30, 41, 59, 0.8);
            transition: background 0.15s ease;
            position: relative;
            z-index: 25;
            flex-shrink: 0;
        }

        .resizer-x:hover, .resizer-x.active {
            background: #E60028;
            box-shadow: 0 0 10px rgba(230, 0, 40, 0.6);
        }

        .pdf-page-container {
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: #FFFFFF;
            position: relative;
            transition: transform 0.15s ease;
        }

        .pdf-page-container:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(230, 0, 40, 0.3);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090D16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Highlight animation for selected comments */
        @keyframes commentPulse {
            0%, 100% { border-color: rgba(230, 0, 40, 0.4); }
            50% { border-color: rgba(0, 240, 255, 0.9); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        }

        .comment-target-highlight {
            animation: commentPulse 2s ease infinite;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-red {
            box-shadow: 0 0 20px -5px rgba(230, 0, 40, 0.4);
        }

        .glow-cyan {
            box-shadow: 0 0 20px -5px rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body class="bg-[#070A11] text-slate-100 h-screen flex flex-col overflow-hidden font-sans select-none antialiased">

    <!-- Top Navigation Bar (Review Mode Only) -->
    <header class="bg-[#090D16] border-b border-slate-800/80 px-4 h-12 flex items-center justify-between gap-3 z-30 shadow-lg flex-shrink-0">
        
        <!-- Left: Brand Logo & Title -->
        <div class="flex items-center gap-3 min-w-0">
            <!-- AEGIS Cyber Badge -->
            <div class="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-rmit-red/15 border border-rmit-red/40 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-rmit-red animate-pulse"></span>
                <span class="text-xs font-black tracking-wider text-white font-mono uppercase">AEGIS REVIEW STUDIO</span>
            </div>

            <div class="h-4 w-px bg-slate-800"></div>

            <div class="flex items-center gap-1.5 text-xs text-slate-300 truncate font-mono">
                <span class="text-slate-500 font-semibold">VBS-2027</span>
                <span class="text-slate-600">/</span>
                <i data-lucide="file-text" class="w-3.5 h-3.5 text-rmit-red"></i>
                <span class="text-slate-100 font-semibold truncate">main.pdf (8 Pages Springer LNCS)</span>
            </div>
        </div>

        <!-- Center: Paper Info & Review Title -->
        <div class="flex items-center gap-2">
            <div class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg flex items-center gap-2 text-xs font-mono text-slate-300 shadow-sm">
                <i data-lucide="book-open" class="w-3.5 h-3.5 text-rmit-red"></i>
                <span class="font-semibold text-slate-200">Paper Review & Advisor Feedback Mode</span>
                <span class="text-slate-600">|</span>
                <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span id="statusText" class="text-slate-400">Ready</span>
            </div>
        </div>

        <!-- Right: Utility Controls -->
        <div class="flex items-center gap-1.5 flex-shrink-0">
            <!-- Review Comments Button -->
            <button onclick="toggleRightSidebar()" id="headerCommentsBtn" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-medium rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 transition" title="Advisor Comments">
                <i data-lucide="message-square" class="w-3.5 h-3.5 text-cyber-cyan"></i>
                <span class="hidden sm:inline">Review Panel</span>
                <span id="commentsCountBadge" class="bg-rmit-red text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
            </button>

            <!-- Reload PDF -->
            <button onclick="reloadPdfDocument()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 p-1.5 rounded-lg transition" title="Reload PDF">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>

            <div class="h-4 w-px bg-slate-800 mx-0.5"></div>

            <!-- Open in New Tab -->
            <button onclick="openPdfNewTab()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 p-1.5 rounded-lg transition" title="Open PDF in new tab">
                <i data-lucide="external-link" class="w-4 h-4"></i>
            </button>

            <!-- Download PDF -->
            <button onclick="downloadPdf()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 p-1.5 rounded-lg transition" title="Download PDF document">
                <i data-lucide="download" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container (Review Focus: PDF Viewer + Review Comments Panel) -->
    <div class="flex-1 flex relative overflow-hidden w-screen" id="workspaceContainer">

        <!-- 1. PDF.JS REALTIME PREVIEW PANE (FULLSCREEN MAIN VIEW) -->
        <div class="preview-pane flex-1 h-full flex flex-col bg-[#070A11] relative min-w-[300px]" id="previewPane">
            <!-- Preview Controls Toolbar -->
            <div class="px-3 py-2 bg-[#090D16] border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 z-10 flex-shrink-0">
                <div class="flex items-center gap-1.5 font-mono">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-rmit-red"></i>
                    <span class="font-semibold text-slate-300">AEGIS Manuscript (main.pdf)</span>
                    <span id="pdfPageInfo" class="text-[11px] text-slate-500 ml-1.5">Loading...</span>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="adjustZoom(-0.1)" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition" title="Zoom Out">
                        <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                    </button>
                    <span id="zoomLevel" class="text-[11px] font-mono w-10 text-center font-medium text-slate-300">115%</span>
                    <button onclick="adjustZoom(0.1)" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition" title="Zoom In">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    </button>
                    <button onclick="resetZoom()" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition ml-1" title="Reset Zoom">
                        <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- PDF Scroll View -->
            <div class="pdf-scroll-view flex-1 overflow-y-auto p-6 flex flex-col items-center gap-6 relative select-text" id="pdfScrollView">
                <div id="pdfLoadingNotice" class="text-slate-400 mt-16 flex items-center gap-2 text-sm font-mono">
                    <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-cyber-cyan"></i>
                    <span>Rendering PDF document...</span>
                </div>
            </div>
        </div>

        <!-- Resizer: Between PDF Preview and Review Comments -->
        <div class="resizer-x" id="resizerPdfComments" title="Drag to resize Review Panel"></div>

        <!-- 2. RIGHT SIDEBAR: REVIEW COMMENTS & ADVISOR FEEDBACK (UNIFIED PANEL) -->
        <div class="right-panel w-[420px] h-full bg-[#080C14] border-l border-slate-800/80 flex flex-col relative z-20 min-w-[280px] max-w-[700px] flex-shrink-0" id="rightSidebar">
            <!-- Sidebar Header -->
            <div class="px-3.5 py-2.5 bg-[#0A0F1A] border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-slate-100 font-mono">
                    <i data-lucide="message-square" class="w-4 h-4 text-cyber-cyan"></i>
                    <span>REVIEW COMMENTS (<span id="panelCommentsCount">0</span>)</span>
                </div>

                <button onclick="toggleRightSidebar()" class="text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition" title="Close Panel">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Filter Chips Bar -->
            <div class="px-3 py-2 bg-[#090D16] border-b border-slate-800/80 flex items-center gap-1.5 overflow-x-auto no-scrollbar font-mono">
                <button class="filter-chip px-2.5 py-1 rounded-lg text-xs bg-rmit-red text-white font-semibold transition shadow-sm" onclick="setCommentFilter('all', this)">
                    All (<span id="countAll">0</span>)
                </button>
                <button class="filter-chip px-2.5 py-1 rounded-lg text-xs bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800 transition" onclick="setCommentFilter('open', this)">
                    Open (<span id="countOpen">0</span>)
                </button>
                <button class="filter-chip px-2.5 py-1 rounded-lg text-xs bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800 transition" onclick="setCommentFilter('resolved', this)">
                    Resolved (<span id="countResolved">0</span>)
                </button>
            </div>

            <!-- Comments List -->
            <div class="comments-list flex-1 overflow-y-auto p-3 flex flex-col gap-2.5 select-text" id="commentsList">
                <!-- Rendered dynamically -->
            </div>

            <!-- Unified Add Feedback / Comment Form -->
            <div class="p-3 bg-[#0A0F1A] border-t border-slate-800 flex flex-col gap-2.5 select-auto">
                <div class="text-xs font-bold text-cyber-cyan flex items-center justify-between font-mono">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                        <span>ADD FEEDBACK / COMMENT</span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-normal">Select text in PDF to quote</span>
                </div>

                <!-- Active Quoted Text from PDF Selection -->
                <div class="active-quote-preview hidden bg-cyber-cyan/10 border-l-2 border-cyber-cyan p-2 rounded-lg text-xs text-cyan-200 items-center justify-between gap-2" id="activeQuotePreview">
                    <div class="flex items-center gap-1.5 overflow-hidden">
                        <i data-lucide="quote" class="w-3 h-3 text-cyber-cyan flex-shrink-0 mt-0.5"></i>
                        <span class="active-quote-text truncate italic" id="activeQuoteText"></span>
                    </div>
                    <button onclick="clearActiveQuote()" class="text-slate-400 hover:text-white p-0.5 flex-shrink-0" title="Remove quote">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>

                <!-- Comment Input Area -->
                <textarea id="commentTextInput" rows="2" placeholder="Write review feedback or note on this section..." class="w-full bg-[#080C14] border border-slate-800 rounded-lg p-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-rmit-red font-sans transition resize-none"></textarea>

                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <!-- Author Input -->
                        <input type="text" id="authorInput" placeholder="Your Name / Role" class="bg-[#080C14] border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyber-cyan font-mono w-32">
                        
                        <!-- Page Number Badge -->
                        <div class="flex items-center gap-1 text-[11px] font-mono text-slate-400 bg-slate-900 px-2 py-1 rounded-md border border-slate-800">
                            <span>Page:</span>
                            <input type="number" id="commentPageInput" min="1" max="8" value="1" class="w-7 bg-transparent text-white font-bold text-center focus:outline-none">
                        </div>
                    </div>

                    <!-- Post Button -->
                    <button onclick="postComment()" class="bg-rmit-red hover:bg-rmit-redDark active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-md transition font-mono">
                        <i data-lucide="send" class="w-3 h-3"></i>
                        <span>Post Review</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Engine (Review-Only Mode) -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        let allComments = [];
        let currentCommentFilter = "all";

        let pdfScale = 1.15;
        let currentPdfDoc = null;

        let activeSelectedQuote = "";
        let activeSelectedPage = "1";

        function refreshIcons() {
            lucide.createIcons();
        }

        function setupResizers() {
            const workspace = document.getElementById("workspaceContainer");
            const rightSidebar = document.getElementById("rightSidebar");
            const resizer2 = document.getElementById("resizerPdfComments");

            let isDragging2 = false;

            resizer2.addEventListener("mousedown", (e) => {
                isDragging2 = true;
                document.body.classList.add("is-resizing");
                resizer2.classList.add("active");
            });

            document.addEventListener("mousemove", (e) => {
                const workspaceRect = workspace.getBoundingClientRect();
                if (isDragging2) {
                    const newRightWidth = workspaceRect.right - e.clientX;
                    if (newRightWidth >= 260 && newRightWidth <= 750) {
                        rightSidebar.style.width = `${newRightWidth}px`;
                    }
                }
            });

            document.addEventListener("mouseup", () => {
                if (isDragging2) {
                    isDragging2 = false;
                    document.body.classList.remove("is-resizing");
                    resizer2.classList.remove("active");
                }
            });
        }

        function toggleRightSidebar() {
            const rightSidebar = document.getElementById("rightSidebar");
            const resizer2 = document.getElementById("resizerPdfComments");
            rightSidebar.classList.toggle("hidden");
            resizer2.style.display = rightSidebar.classList.contains("hidden") ? "none" : "flex";
            refreshIcons();
        }

        // PDF.JS Rendering Implementation
        // High-DPI / Retina Crisp PDF Rendering Implementation
        async function renderCurrentPdfPages() {
            if (!currentPdfDoc) return;
            const container = document.getElementById("pdfScrollView");
            const pageInfo = document.getElementById("pdfPageInfo");
            const notice = document.getElementById("pdfLoadingNotice");

            // Retain scroll position ratio during zoom
            const prevScrollRatio = container.scrollTop / Math.max(container.scrollHeight - container.clientHeight, 1);

            if (notice) notice.style.display = "none";
            container.innerHTML = "";

            pageInfo.textContent = `${currentPdfDoc.numPages} Pages`;

            // Device pixel ratio for ultra-sharp vector text (minimum 2.0x supersampling)
            const dpr = Math.max(window.devicePixelRatio || 1, 2.0);

            for (let i = 1; i <= currentPdfDoc.numPages; i++) {
                const page = await currentPdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: pdfScale });
                const renderViewport = page.getViewport({ scale: pdfScale * dpr });

                const pageContainer = document.createElement("div");
                pageContainer.className = "pdf-page-container relative mb-6 shadow-2xl rounded";
                pageContainer.id = `pdf-page-${i}`;
                pageContainer.dataset.pageNum = i;
                pageContainer.style.width = `${Math.floor(viewport.width)}px`;
                pageContainer.style.height = `${Math.floor(viewport.height)}px`;

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d", { alpha: false });
                
                // Set internal canvas bitmap size to high-res
                canvas.width = Math.floor(renderViewport.width);
                canvas.height = Math.floor(renderViewport.height);
                
                // Set CSS display size to match unscaled viewport
                canvas.style.width = `${Math.floor(viewport.width)}px`;
                canvas.style.height = `${Math.floor(viewport.height)}px`;
                canvas.className = "block w-full h-full rounded";

                const renderContext = {
                    canvasContext: context,
                    viewport: renderViewport,
                    transform: [dpr, 0, 0, dpr, 0, 0]
                };

                pageContainer.appendChild(canvas);

                // Interactive Text Layer for selection and quote grabbing
                const textContent = await page.getTextContent();
                const textLayerDiv = document.createElement("div");
                textLayerDiv.className = "textLayer absolute inset-0 rounded";
                textLayerDiv.style.width = `${Math.floor(viewport.width)}px`;
                textLayerDiv.style.height = `${Math.floor(viewport.height)}px`;
                pageContainer.appendChild(textLayerDiv);

                pdfjsLib.renderTextLayer({
                    textContentSource: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });

                // Page number badge
                const pageBadge = document.createElement("div");
                pageBadge.className = "absolute top-2 right-2 bg-slate-900/85 backdrop-blur text-slate-200 font-mono text-[10px] px-2 py-0.5 rounded border border-slate-700/60 pointer-events-none shadow";
                pageBadge.textContent = `P. ${i} / ${currentPdfDoc.numPages}`;
                pageContainer.appendChild(pageBadge);

                container.appendChild(pageContainer);
                await page.render({ canvasContext: context, viewport: renderViewport }).promise;
            }

            // Restore proportional scroll position
            container.scrollTop = prevScrollRatio * (container.scrollHeight - container.clientHeight);
            refreshIcons();
        }

        async function loadPdfDocument(pdfUrl) {
            const notice = document.getElementById("pdfLoadingNotice");
            try {
                if (notice) notice.style.display = "flex";
                const loadingTask = pdfjsLib.getDocument({
                    url: `${pdfUrl}?t=${Date.now()}`,
                    cMapUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/",
                    cMapPacked: true
                });
                currentPdfDoc = await loadingTask.promise;
                await renderCurrentPdfPages();
            } catch (err) {
                console.error("PDF Load error:", err);
                if (notice) {
                    notice.innerHTML = `<span class="text-rmit-red"><i data-lucide="alert-triangle" class="w-4 h-4 inline"></i> PDF load failed: ${err.message}</span>`;
                    refreshIcons();
                }
            }
        }

        function reloadPdfDocument() {
            loadPdfDocument("main.pdf");
        }

        let zoomTimeout = null;
        function adjustZoom(delta) {
            pdfScale = Math.max(0.5, Math.min(3.0, Math.round((pdfScale + delta) * 10) / 10));
            document.getElementById("zoomLevel").textContent = `${Math.round(pdfScale * 100)}%`;
            if (currentPdfDoc) {
                clearTimeout(zoomTimeout);
                zoomTimeout = setTimeout(() => {
                    renderCurrentPdfPages();
                }, 100);
            }
        }

        function resetZoom() {
            pdfScale = 1.25;
            document.getElementById("zoomLevel").textContent = "125%";
            if (currentPdfDoc) {
                renderCurrentPdfPages();
            }
        }

        function setupPdfMouseWheelZoom() {
            const pdfContainer = document.getElementById("pdfScrollView");
            pdfContainer.addEventListener("wheel", (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.1 : -0.1;
                    adjustZoom(delta);
                }
            }, { passive: false });
        }
            document.addEventListener("selectionchange", () => {
                const selection = window.getSelection();
                const text = selection.toString().trim();
                if (text && text.length > 3) {
                    activeSelectedQuote = text;
                    const activeEl = document.activeElement;
                    const pageEl = activeEl ? activeEl.closest(".pdf-page-container") : null;
                    if (pageEl) {
                        activeSelectedPage = pageEl.dataset.pageNum || "1";
                    }

                    const quotePreview = document.getElementById("activeQuotePreview");
                    const quoteText = document.getElementById("activeQuoteText");
                    const pageInput = document.getElementById("commentPageInput");

                    if (quotePreview && quoteText) {
                        quoteText.textContent = text.length > 80 ? text.substring(0, 80) + "..." : text;
                        quotePreview.classList.remove("hidden");
                        quotePreview.classList.add("flex");
                        if (pageInput) pageInput.value = activeSelectedPage;
                    }
                }
            });
        }

        function clearActiveQuote() {
            activeSelectedQuote = "";
            const quotePreview = document.getElementById("activeQuotePreview");
            if (quotePreview) {
                quotePreview.classList.remove("flex");
                quotePreview.classList.add("hidden");
            }
        }

        // Review Comments API Interactions
        async function fetchComments() {
            try {
                const res = await fetch("/api/comments");
                allComments = await res.json();
                renderCommentsList();
            } catch (err) {
                console.error("Error fetching comments:", err);
            }
        }

        function setCommentFilter(filter, el) {
            currentCommentFilter = filter;
            document.querySelectorAll(".filter-chip").forEach(btn => {
                btn.className = "filter-chip px-2.5 py-1 rounded-lg text-xs bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800 transition font-mono";
            });
            el.className = "filter-chip px-2.5 py-1 rounded-lg text-xs bg-rmit-red text-white font-semibold transition shadow-sm font-mono";
            renderCommentsList();
        }

        function renderCommentsList() {
            const listEl = document.getElementById("commentsList");
            const countBadge = document.getElementById("commentsCountBadge");
            const panelBadge = document.getElementById("panelCommentsCount");
            const countAll = document.getElementById("countAll");
            const countOpen = document.getElementById("countOpen");
            const countResolved = document.getElementById("countResolved");

            const openComments = allComments.filter(c => !c.resolved);
            const resolvedComments = allComments.filter(c => c.resolved);

            if (countBadge) countBadge.textContent = openComments.length;
            if (panelBadge) panelBadge.textContent = allComments.length;
            if (countAll) countAll.textContent = allComments.length;
            if (countOpen) countOpen.textContent = openComments.length;
            if (countResolved) countResolved.textContent = resolvedComments.length;

            let filtered = allComments;
            if (currentCommentFilter === "open") filtered = openComments;
            if (currentCommentFilter === "resolved") filtered = resolvedComments;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 flex flex-col items-center gap-2 text-slate-500 font-mono text-xs">
                        <i data-lucide="message-square-dashed" class="w-8 h-8 text-slate-600"></i>
                        <span>No comments in this filter.</span>
                    </div>
                `;
                refreshIcons();
                return;
            }

            listEl.innerHTML = filtered.map(c => `
                <div class="bg-[#0A0F1A] border ${c.resolved ? 'border-slate-800/60 opacity-60' : 'border-slate-800 hover:border-slate-700'} rounded-xl p-3 flex flex-col gap-2 transition shadow-sm" id="comment-card-${c.id}">
                    <div class="flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-2 font-mono">
                            <span class="font-bold text-slate-200 flex items-center gap-1">
                                <i data-lucide="user" class="w-3 h-3 text-rmit-red"></i>
                                ${escapeHtml(c.author || 'Reviewer')}
                            </span>
                            <span class="text-[10px] text-slate-500">${formatTimeAgo(c.timestamp)}</span>
                        </div>
                        
                        <div class="flex items-center gap-1 font-mono">
                            ${c.page ? `
                                <button onclick="scrollToPdfPage(${c.page})" class="px-1.5 py-0.5 rounded bg-slate-900 hover:bg-slate-800 text-[10px] text-cyber-cyan border border-slate-800 flex items-center gap-1 transition" title="Go to page ${c.page}">
                                    <i data-lucide="bookmark" class="w-2.5 h-2.5"></i>
                                    P.${c.page}
                                </button>
                            ` : ''}

                            <button onclick="toggleCommentResolve('${c.id}')" class="p-1 rounded ${c.resolved ? 'text-emerald-400 hover:text-slate-400' : 'text-slate-400 hover:text-emerald-400'} hover:bg-slate-800 transition" title="${c.resolved ? 'Mark Open' : 'Mark Resolved'}">
                                <i data-lucide="${c.resolved ? 'check-circle' : 'circle'}" class="w-3.5 h-3.5"></i>
                            </button>

                            <button onclick="deleteComment('${c.id}')" class="p-1 rounded text-slate-500 hover:text-red-400 hover:bg-slate-800 transition" title="Delete comment">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    ${c.quote ? `
                        <div class="bg-[#080C14] border-l-2 border-cyber-cyan/70 px-2.5 py-1.5 rounded text-[11px] text-cyan-200/90 italic">
                            "${escapeHtml(c.quote)}"
                        </div>
                    ` : ''}

                    <div class="text-xs text-slate-300 leading-relaxed font-sans select-text">
                        ${escapeHtml(c.text)}
                    </div>
                </div>
            `).join("");

            refreshIcons();
        }

        async function postComment() {
            const textInput = document.getElementById("commentTextInput");
            const authorInput = document.getElementById("authorInput");
            const pageInput = document.getElementById("commentPageInput");

            const text = textInput.value.trim();
            const author = authorInput.value.trim() || "Reviewer";
            const page = parseInt(pageInput.value) || 1;

            if (!text) {
                textInput.focus();
                return;
            }

            const commentObj = {
                id: "c_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                text: text,
                author: author,
                page: page,
                quote: activeSelectedQuote || "",
                timestamp: new Date().toISOString(),
                resolved: false
            };

            localStorage.setItem("latex_author_name", author);

            try {
                const res = await fetch("/api/comments", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: json.stringify(commentObj)
                });
                if (res.ok) {
                    textInput.value = "";
                    clearActiveQuote();
                    await fetchComments();
                }
            } catch (err) {
                console.error("Failed to post comment:", err);
            }
        }

        async function toggleCommentResolve(id) {
            const comment = allComments.find(c => c.id === id);
            if (!comment) return;

            try {
                await fetch("/api/comments", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: id, resolved: !comment.resolved })
                });
                await fetchComments();
            } catch (err) {
                console.error("Failed to update comment:", err);
            }
        }

        async function deleteComment(id) {
            try {
                await fetch(`/api/comments?id=${encodeURIComponent(id)}`, { method: "DELETE" });
                await fetchComments();
            } catch (err) {
                console.error("Failed to delete comment:", err);
            }
        }

        function scrollToPdfPage(pageNum) {
            const pageEl = document.getElementById(`pdf-page-${pageNum}`);
            if (pageEl) {
                pageEl.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        function openPdfNewTab() {
            window.open("/pdf", "_blank");
        }

        function downloadPdf() {
            const a = document.createElement("a");
            a.href = "/pdf";
            a.download = "AEGIS_VBS2027_Paper.pdf";
            a.click();
        }

        function formatTimeAgo(isoString) {
            if (!isoString) return "";
            const sec = Math.floor((Date.now() - new Date(isoString).getTime()) / 1000);
            if (sec < 60) return "just now";
            if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
            return `${Math.floor(sec / 86400)}d ago`;
        }

        function escapeHtml(str) {
            return String(str || "").replace(/[&<>"']/g, m => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            }[m]));
        }

        window.addEventListener("DOMContentLoaded", async () => {
            setupResizers();
            setupTextSelectionListener();
            setupPdfMouseWheelZoom();

            const savedAuthor = localStorage.getItem("latex_author_name");
            if (savedAuthor) {
                document.getElementById("authorInput").value = savedAuthor;
            }

            fetchComments();
            loadPdfDocument("main.pdf");
            refreshIcons();
        });
    </script>
</body>
</html>
